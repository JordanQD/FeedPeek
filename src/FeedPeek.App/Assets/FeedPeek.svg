<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>FeedPeek</title>
  <desc>Three overlapping geometric signal layers in forest and emerald green.</desc>
  <defs>
    <linearGradient id="outer" gradientUnits="userSpaceOnUse" x1="8" y1="4" x2="43" y2="24.207">
      <stop stop-color="#287B5B"/>
      <stop offset="1" stop-color="#104A39"/>
    </linearGradient>
    <linearGradient id="middle" gradientUnits="userSpaceOnUse" x1="5" y1="15" x2="34" y2="31.743">
      <stop stop-color="#39AE80"/>
      <stop offset="1" stop-color="#147453"/>
    </linearGradient>
    <linearGradient id="inner" gradientUnits="userSpaceOnUse" x1="4" y1="29" x2="19" y2="37.660">
      <stop stop-color="#71D8AC"/>
      <stop offset="1" stop-color="#2CA578"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#062D20" stop-opacity=".18"/>
      <stop offset="1" stop-color="#062D20" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="outer-clip"><path d="M10 4H16.17Q17 4 17.59 4.59L43.41 30.41Q44 31 44 31.83V38Q44 40 42 40H10Q8 40 8 38V6Q8 4 10 4Z"/></clipPath>
    <clipPath id="middle-clip"><path d="M8 15H13.17Q14 15 14.59 15.59L33.41 34.41Q34 35 34 35.83V40Q34 42 32 42H8Q6 42 6 40V17Q6 15 8 15Z"/></clipPath>
  </defs>
  <g id="outer-signal">
    <path d="M10 4H16.17Q17 4 17.59 4.59L43.41 30.41Q44 31 44 31.83V38Q44 40 42 40H10Q8 40 8 38V6Q8 4 10 4Z" fill="url(#outer)"/>
  </g>
  <g id="outer-overlap-shadow" clip-path="url(#outer-clip)">
    <path d="M8 15H13.17Q14 15 14.59 15.59L33.41 34.41Q34 35 34 35.83V40Q34 42 32 42H8Q6 42 6 40V17Q6 15 8 15Z" transform="translate(0 -0.75)" fill="url(#seam)"/>
  </g>
  <g id="middle-signal">
    <path d="M8 15H13.17Q14 15 14.59 15.59L33.41 34.41Q34 35 34 35.83V40Q34 42 32 42H8Q6 42 6 40V17Q6 15 8 15Z" fill="url(#middle)"/>
  </g>
  <g id="inner-overlap-shadow" clip-path="url(#middle-clip)">
    <path d="M6 29H13.17Q14 29 14.59 29.59L18.41 33.41Q19 34 19 34.83V42Q19 44 17 44H6Q4 44 4 42V31Q4 29 6 29Z" transform="translate(0 -0.75)" fill="url(#seam)"/>
  </g>
  <g id="inner-signal">
